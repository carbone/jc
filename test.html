<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SetbackApp Tests</title>
  <style>
    body { font-family: monospace; margin: 20px; background: #111; color: #eee; }
    h2 { margin-top: 0; }
    h3 { color: #888; margin: 16px 0 4px; border-bottom: 1px solid #333; padding-bottom: 4px; }
    .pass { color: #4c4; padding: 2px 0; }
    .fail { color: #e44; padding: 2px 0; font-weight: bold; }
    .error-detail { color: #a66; font-weight: normal; font-size: 0.9em; }
    #summary { font-size: 1.4em; margin: 16px 0; padding: 8px; border: 2px solid; }
    #summary.pass { border-color: #4c4; }
    #summary.fail { border-color: #e44; }
  </style>
</head>
<body>
  <h2>SetbackApp — Test Suite</h2>
  <div id="summary"></div>
  <div id="results"></div>

  <!-- Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

  <!-- Code under test -->
  <script src="app.js"></script>

  <!-- Tests -->
  <script src="test.js"></script>
</body>
</html>
